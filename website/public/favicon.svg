<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E63030;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C82828;stop-opacity:1" />
    </linearGradient>
    <!-- Subtle Boing stripe pattern -->
    <pattern id="stripes" patternUnits="userSpaceOnUse" width="4" height="4" patternTransform="rotate(45)">
      <rect width="2" height="4" fill="rgba(255,255,255,0.03)" />
    </pattern>
  </defs>

  <!-- Background circle with gradient -->
  <circle cx="16" cy="16" r="16" fill="url(#bg)" />

  <!-- Subtle stripe overlay -->
  <circle cx="16" cy="16" r="16" fill="url(#stripes)" />

  <!-- Letter N -->
  <text x="16" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">N</text>
</svg>
