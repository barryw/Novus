# Website - Build and deploy novuslang.com
when:
  - event: push
    branch: main
    path:
      include:
        - website/**
        - deploy/**

# Use Linux runner for Docker builds
labels:
  platform: linux/amd64

steps:
  - name: build-push
    image: gcr.io/kaniko-project/executor:debug
    environment:
      GHCR_USERNAME:
        from_secret: ghcr_username
      GHCR_TOKEN:
        from_secret: ghcr_token
    commands:
      - mkdir -p /kaniko/.docker
      - echo "{\"auths\":{\"ghcr.io\":{\"username\":\"$GHCR_USERNAME\",\"password\":\"$GHCR_TOKEN\"}}}" > /kaniko/.docker/config.json
      - /kaniko/executor --context=$CI_WORKSPACE/website --dockerfile=$CI_WORKSPACE/website/Dockerfile --destination=ghcr.io/barryw/novuslang-website:build-$CI_PIPELINE_NUMBER --destination=ghcr.io/barryw/novuslang-website:latest

  - name: deploy
    image: bitnami/kubectl:latest
    commands:
      - kubectl get namespace novus || kubectl create namespace novus
      # WAL-104 hardening — a deploy must never take the site down.
      # 1) Validate the rendered manifests server-side BEFORE mutating anything,
      #    so an invalid object (e.g. the duplicate "http" port that once wedged
      #    this Deployment) fails the pipeline without touching the live site.
      - kubectl apply -k deploy/ --server-side --force-conflicts --dry-run=server
      # 2) Server-side apply reconciles by field ownership instead of the
      #    client-side 3-way strategic merge that duplicated the container port
      #    and left the Deployment unreconcilable. No delete, no downtime.
      - kubectl apply -k deploy/ --server-side --force-conflicts
      - kubectl set image deployment/novuslang-website website=ghcr.io/barryw/novuslang-website:build-$CI_PIPELINE_NUMBER -n novus
      # 3) Roll forward; the Deployment's maxUnavailable:0 keeps old pods serving
      #    until new ones are Ready. If the new revision never becomes healthy,
      #    auto-revert to the last good ReplicaSet so the site is never stranded
      #    on a broken revision.
      - |
        if ! kubectl rollout status deployment/novuslang-website -n novus --timeout=120s; then
          echo "Rollout did not become healthy — rolling back to previous revision"
          kubectl rollout undo deployment/novuslang-website -n novus
          kubectl rollout status deployment/novuslang-website -n novus --timeout=120s
          exit 1
        fi
      - kubectl get pods -n novus
    depends_on:
      - build-push

  - name: purge-cache
    image: curlimages/curl:latest
    environment:
      CLOUDFLARE_ZONE_ID:
        from_secret: cloudflare_zone_id
      CLOUDFLARE_API_TOKEN:
        from_secret: cloudflare_api_token
    commands:
      - |
        curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
          -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
          -H "Content-Type: application/json" \
          --data '{"purge_everything":true}'
      - echo "Cloudflare cache purged for novuslang.com"
    depends_on:
      - deploy
