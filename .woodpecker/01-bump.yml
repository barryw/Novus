# Bump version on push to main
when:
  - event: push
    branch: main

labels:
  platform: linux/amd64

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      tags: true
      depth: 0

steps:
  # WAL-70: mint a short-lived, down-scoped GitHub App installation token
  # (product-ci profile: contents=write,metadata=read) in place of the shared
  # admin PAT. The minter is vendored in the woodpecker-release plugin image;
  # GH_APP_* are org-level Woodpecker secrets scoped to that image. The token
  # expires in ~1h — a natural fit for a short-lived pipeline, no rotation.
  - name: bump-version
    image: ghcr.io/barryw/woodpecker-release:latest
    pull: true
    environment:
      GH_APP_ID:
        from_secret: gh_app_id
      GH_APP_INSTALLATION_ID:
        from_secret: gh_app_installation_id
      GH_APP_PRIVATE_KEY:
        from_secret: gh_app_private_key
    commands:
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - git config user.name "Woodpecker CI"
      - git config user.email "ci@novuslang.com"
      - GITHUB_TOKEN=$(/plugin/mint-installation-token.sh --profile product-ci)
      - test -n "$GITHUB_TOKEN" || { echo "FATAL: empty minted token"; exit 1; }
      - echo "Minted GitHub App installation token (product-ci profile)."
      - git remote set-url origin "https://x-access-token:$GITHUB_TOKEN@github.com/${CI_REPO}.git"
      - cog bump --auto && git push --follow-tags || echo "No version bump needed"
      - echo "Current version:" && cog get-version
