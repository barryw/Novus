# Build & Release - Full automation on push to main
#
# 1. Validates conventional commits
# 2. Bumps version (if feat/fix commits exist)
# 3. Builds AOT binaries for all platforms
# 4. Creates GitHub release with binaries
#
# Just push to main. Everything else is automatic.

when:
  - event: push
    branch: main

matrix:
  include:
    - platform: linux/amd64
      rid: linux-x64
      binary_name: novus-linux-x64
      image: mcr.microsoft.com/dotnet/sdk:9.0
      is_primary: "true"
    - platform: darwin/amd64
      rid: osx-x64
      binary_name: novus-macos-x64
      image: bash
      is_primary: "false"
    - platform: darwin/arm64
      rid: osx-arm64
      binary_name: novus-macos-arm64
      image: bash
      is_primary: "false"
    - platform: windows/amd64
      rid: win-x64
      binary_name: novus-windows-x64.exe
      image: powershell
      is_primary: "false"

labels:
  platform: ${platform}

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      tags: true

steps:
  - name: bump-version
    image: ${image}
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      # Only primary job does the bump to avoid race conditions
      - |
        if [ "${is_primary}" = "true" ]; then
          echo "=== Bumping version ==="
          git config user.name "Woodpecker CI"
          git config user.email "ci@novuslang.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${CI_REPO}.git

          # Install cog if not available (for Docker image)
          which cog || (curl -sSL https://raw.githubusercontent.com/cocogitto/cocogitto/main/scripts/install.sh | sh -s -- --dest /usr/local/bin)

          cog bump --auto && git push --follow-tags || echo "No version bump needed"
        else
          echo "Waiting for primary job to bump version..."
          sleep 15
        fi
      # Get current version for this build
      - |
        if command -v cog > /dev/null 2>&1; then
          VERSION=$(cog get-version 2>/dev/null || git describe --tags --abbrev=0 2>/dev/null || echo "dev")
        else
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "dev")
        fi
        echo "Building version: $VERSION"
        echo "$VERSION" > .version

  - name: build
    image: ${image}
    commands:
      - echo "Building Novus for ${rid}..."
      - dotnet publish Novus/Novus.csproj -c Release -r ${rid} -o ./publish --self-contained true
      - ls -la ./publish/ || dir ./publish/

  - name: prepare-artifacts
    image: ${image}
    commands:
      - |
        if [ -f ./publish/novus.exe ]; then
          cp ./publish/novus.exe ./${binary_name}
        elif [ -f ./publish/novus ]; then
          cp ./publish/novus ./${binary_name}
          chmod +x ./${binary_name}
        elif [ -f ./publish/Novus.exe ]; then
          cp ./publish/Novus.exe ./${binary_name}
        else
          cp ./publish/Novus ./${binary_name}
          chmod +x ./${binary_name} 2>/dev/null || true
        fi
      - |
        if command -v sha256sum > /dev/null 2>&1; then
          sha256sum ${binary_name} > ${binary_name}.sha256
        elif command -v shasum > /dev/null 2>&1; then
          shasum -a 256 ${binary_name} > ${binary_name}.sha256
        else
          powershell -Command "(Get-FileHash -Algorithm SHA256 ${binary_name}).Hash.ToLower() + '  ${binary_name}'" > ${binary_name}.sha256
        fi
      - echo "=== Artifacts ==="
      - ls -la ${binary_name}* 2>/dev/null || dir ${binary_name}*
      - cat ${binary_name}.sha256 2>/dev/null || type ${binary_name}.sha256

  - name: upload-to-release
    image: ${image}
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - VERSION=$(cat .version)
      - echo "Uploading ${binary_name} for version ${VERSION}..."
      - |
        if [ "$VERSION" = "dev" ]; then
          echo "No version tag, skipping release upload"
          exit 0
        fi
      # Create release if it doesn't exist
      - gh release create "v${VERSION}" --repo ${CI_REPO} --generate-notes 2>/dev/null || echo "Release exists"
      # Upload binary
      - gh release upload "v${VERSION}" ${binary_name} ${binary_name}.sha256 --repo ${CI_REPO} --clobber
      - echo "✓ Uploaded ${binary_name}"
