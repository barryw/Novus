# Release - Auto-bump version and create tag
#
# Triggered on every push to main. Analyzes commits since last tag
# and bumps version accordingly (if there are bumpable commits):
# - feat commits → minor bump
# - fix commits → patch bump
# - BREAKING CHANGE → major bump
#
# If only docs/chore/ci commits, no version bump occurs.

when:
  - event: push
    branch: main

labels:
  platform: linux/amd64

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      tags: true

steps:
  - name: bump-version
    image: ghcr.io/cocogitto/cog:latest
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - git config user.name "Woodpecker CI"
      - git config user.email "ci@novuslang.com"
      # Configure git to use token for push
      - git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${CI_REPO}.git
      # Try to bump - exits 0 even if nothing to bump
      - cog bump --auto || echo "No version bump needed"
      - git push --follow-tags || echo "Nothing to push"
      - echo "Current version:" && cog get-version
