# Programmer's Guide - Build PDF from LaTeX
when:
  - event: push
    branch: main
    path:
      include:
        - guide/**
        - .woodpecker/guide.yml

# Use Linux runner for LaTeX builds
labels:
  platform: linux/amd64

steps:
  - name: build-pdf
    image: texlive/texlive:latest
    commands:
      - cd guide
      - make all
      - ls -la novus-guide.pdf
      - echo "PDF built successfully ($(stat -c%s novus-guide.pdf) bytes)"
