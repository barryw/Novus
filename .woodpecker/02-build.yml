# Build AOT binaries for all platforms
when:
  - event: push
    branch: main

depends_on:
  - 01-bump

matrix:
  include:
    - platform: linux/amd64
      rid: linux-x64
      binary_name: novus-linux-x64
      image: mcr.microsoft.com/dotnet/sdk:10.0
    # Both macOS builds run on arm64 agent via cross-compilation
    - platform: darwin/arm64
      rid: osx-x64
      binary_name: novus-macos-x64
      image: bash
    - platform: darwin/arm64
      rid: osx-arm64
      binary_name: novus-macos-arm64
      image: bash

labels:
  platform: ${platform}

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      tags: true

steps:
  - name: get-version
    image: ${image}
    commands:
      - git fetch --tags 2>/dev/null || true
      - VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "dev")
      - echo "Building version $VERSION"
      - echo "$VERSION" > .version

  - name: build
    image: ${image}
    commands:
      - echo "Building Novus for ${rid}..."
      # Install build tools if needed (Linux Docker image)
      - apt-get update && apt-get install -y make gcc 2>/dev/null || true
      # macOS: prefer system dotnet over Homebrew (Homebrew ilc 10.0.2 crashes)
      - export PATH="/usr/local/share/dotnet:$PATH"
      # macOS: use shared NuGet cache (isolated HOME can cause ilc issues)
      - export NUGET_PACKAGES="${NUGET_PACKAGES:-$HOME/.nuget/packages}"
      - test -d /Users && export NUGET_PACKAGES="/Users/barry/.nuget/packages" || true
      - dotnet --version
      - echo "NUGET_PACKAGES=$NUGET_PACKAGES"
      - dotnet publish Novus/Novus.csproj -c Release -r ${rid} -o ./publish --self-contained true
      - ls -la ./publish/

  - name: prepare-artifacts
    image: ${image}
    commands:
      - |
        if [ -f ./publish/novus ]; then
          cp ./publish/novus ./${binary_name}
        else
          cp ./publish/Novus ./${binary_name}
        fi
      - chmod +x ./${binary_name} 2>/dev/null || true
      - |
        if command -v sha256sum > /dev/null 2>&1; then
          sha256sum ${binary_name} > ${binary_name}.sha256
        else
          shasum -a 256 ${binary_name} > ${binary_name}.sha256
        fi
      - ls -la ${binary_name}*

  - name: upload-to-release
    image: ${image}
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      # Install gh CLI if not present (Linux Docker)
      - |
        if ! command -v gh &> /dev/null; then
          apt-get update && apt-get install -y curl gpg 2>/dev/null || true
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | gpg --dearmor -o /usr/share/keyrings/githubcli-archive-keyring.gpg 2>/dev/null || true
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list 2>/dev/null || true
          apt-get update && apt-get install -y gh 2>/dev/null || true
        fi
      - VERSION=$(cat .version)
      - echo "Uploading ${binary_name} for version $VERSION"
      - |
        if [ "$VERSION" = "dev" ]; then
          echo "No version tag, skipping upload"
          exit 0
        fi
      # VERSION already contains the 'v' prefix from git describe
      - gh release create "$VERSION" --repo ${CI_REPO} --generate-notes 2>/dev/null || echo "Release exists"
      - gh release upload "$VERSION" ${binary_name} ${binary_name}.sha256 --repo ${CI_REPO} --clobber
      - echo "Uploaded ${binary_name}"
