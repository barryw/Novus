# Build AOT binaries for all platforms
when:
  - event: push
    branch: main

depends_on:
  - 01-bump

matrix:
  include:
    - platform: linux/amd64
      rid: linux-x64
      binary_name: novus-linux-x64
      image: mcr.microsoft.com/dotnet/sdk:9.0
    - platform: darwin/amd64
      rid: osx-x64
      binary_name: novus-macos-x64
      image: bash
    - platform: darwin/arm64
      rid: osx-arm64
      binary_name: novus-macos-arm64
      image: bash
    - platform: windows/amd64
      rid: win-x64
      binary_name: novus-windows-x64.exe
      image: powershell

labels:
  platform: ${platform}

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      tags: true

steps:
  - name: get-version
    image: ${image}
    commands:
      - git fetch --tags 2>/dev/null || true
      - VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "dev")
      - echo "Building version $VERSION"
      - echo "$VERSION" > .version

  - name: build
    image: ${image}
    commands:
      - echo "Building Novus for ${rid}..."
      - dotnet publish Novus/Novus.csproj -c Release -r ${rid} -o ./publish --self-contained true
      - ls -la ./publish/ || dir ./publish/

  - name: prepare-artifacts
    image: ${image}
    commands:
      - |
        if [ -f ./publish/novus.exe ]; then
          cp ./publish/novus.exe ./${binary_name}
        elif [ -f ./publish/novus ]; then
          cp ./publish/novus ./${binary_name}
          chmod +x ./${binary_name}
        elif [ -f ./publish/Novus.exe ]; then
          cp ./publish/Novus.exe ./${binary_name}
        else
          cp ./publish/Novus ./${binary_name}
          chmod +x ./${binary_name} 2>/dev/null || true
        fi
      - |
        if command -v sha256sum > /dev/null 2>&1; then
          sha256sum ${binary_name} > ${binary_name}.sha256
        elif command -v shasum > /dev/null 2>&1; then
          shasum -a 256 ${binary_name} > ${binary_name}.sha256
        else
          powershell -Command "(Get-FileHash -Algorithm SHA256 ${binary_name}).Hash.ToLower() + '  ${binary_name}'" > ${binary_name}.sha256
        fi
      - ls -la ${binary_name}* 2>/dev/null || dir ${binary_name}*

  - name: upload-to-release
    image: ${image}
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - VERSION=$(cat .version)
      - echo "Uploading ${binary_name} for version $VERSION"
      - |
        if [ "$VERSION" = "dev" ]; then
          echo "No version tag, skipping upload"
          exit 0
        fi
      - gh release create "v$VERSION" --repo ${CI_REPO} --generate-notes 2>/dev/null || echo "Release exists"
      - gh release upload "v$VERSION" ${binary_name} ${binary_name}.sha256 --repo ${CI_REPO} --clobber
      - echo "Uploaded ${binary_name}"
