[package]
name = "{{PROJECT_NAME}}"
version = "1.0.0"
type = "cli"
entry = "./src/main.novus"

[build]
# Target CPU: auto, 68020, 68030, 68040, 68060
target_cpu = "68020"

# FPU mode: auto, soft, 68881, 68040
fpu = "auto"

# Chipset: auto, OCS, ECS, AGA
chipset = "auto"

# Optimization level: 0 (none), 1 (basic), 2 (full), 3 (aggressive)
optimization_level = 1

[dependencies]
# Add dependencies here
# example = { path = "../other-project" }
