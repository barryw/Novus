# Cocogitto configuration for semantic versioning
# https://docs.cocogitto.io/

from_latest_tag = true
ignore_merge_commits = true
branch_whitelist = ["main"]
tag_prefix = "v"
skip_ci = "[skip ci]"
skip_untracked = false

# Version bump hooks - update .csproj files when version changes.
# NOTE: cog bump runs in the linux cog CI image, so use GNU/busybox sed
# in-place syntax (`sed -i`), NOT the BSD `sed -i ''` form which treats the
# empty arg as the script and fails on linux.
pre_bump_hooks = [
    "sed -i 's/<Version>.*<\\/Version>/<Version>{{version}}<\\/Version>/g' Novus/Novus.csproj Novus.Core/Novus.Core.csproj",
    "git add Novus/Novus.csproj Novus.Core/Novus.Core.csproj"
]
post_bump_hooks = []

[changelog]
path = "CHANGELOG.md"
authors = [
    { signature = "Claude Opus 4.5", username = "claude" }
]

# Commit types and their changelog sections
[commit_types]
brand = { changelog_title = "Branding" }
feat = { changelog_title = "Features" }
fix = { changelog_title = "Bug Fixes" }
docs = { changelog_title = "Documentation" }
refactor = { changelog_title = "Refactoring" }
test = { changelog_title = "Tests" }
chore = { changelog_title = "Miscellaneous" }
perf = { changelog_title = "Performance" }
style = { changelog_title = "Style" }
ci = { changelog_title = "CI/CD" }
build = { changelog_title = "Build" }

[git_hooks.commit-msg]
script = """#!/bin/sh
set -e
cog verify --file $1
"""

[bump_profiles]
