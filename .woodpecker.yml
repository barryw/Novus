# Woodpecker CI Pipeline for Novus
# Builds website, deploys to k8s, and generates programmer's guide PDF

when:
  - event: [push, pull_request, manual]
    branch: main

variables:
  - &image_name "ghcr.io/barryw/novuslang-website"

steps:
  # =============================================================================
  # Website Build & Deploy
  # =============================================================================

  build-website:
    image: docker:dind
    commands:
      - cd website
      - docker build -t ${image_name}:${CI_COMMIT_SHA:0:7} -t ${image_name}:latest .
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    when:
      - event: [push, manual]
        branch: main
        path:
          include: ['website/**']

  push-website:
    image: docker:dind
    environment:
      DOCKER_USERNAME:
        from_secret: docker_username
      DOCKER_PASSWORD:
        from_secret: ghcr_token
    commands:
      - echo "$DOCKER_PASSWORD" | docker login ghcr.io -u "$DOCKER_USERNAME" --password-stdin
      - docker push ${image_name}:${CI_COMMIT_SHA:0:7}
      - docker push ${image_name}:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    when:
      - event: [push, manual]
        branch: main
        path:
          include: ['website/**']
    depends_on:
      - build-website

  deploy-website:
    image: bitnami/kubectl:latest
    environment:
      KUBECONFIG_DATA:
        from_secret: kubeconfig
    commands:
      - mkdir -p ~/.kube
      - echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config
      - kubectl set image deployment/novuslang-website website=${image_name}:${CI_COMMIT_SHA:0:7} -n novus
      - kubectl rollout status deployment/novuslang-website -n novus --timeout=120s
    when:
      - event: [push, manual]
        branch: main
        path:
          include: ['website/**']
    depends_on:
      - push-website

  # =============================================================================
  # Programmer's Guide PDF Build
  # =============================================================================

  build-guide:
    image: texlive/texlive:latest
    commands:
      - cd guide
      - make all
      - cp novus-guide.pdf ../novus-guide-${CI_COMMIT_SHA:0:7}.pdf
    when:
      - event: [push, manual]
        branch: main
        path:
          include: ['guide/**']

  # Upload guide as artifact (available for download)
  upload-guide:
    image: woodpeckerci/plugin-s3
    settings:
      bucket: novus-artifacts
      source: novus-guide-*.pdf
      target: /guide/
      acl: public-read
      endpoint:
        from_secret: s3_endpoint
      access_key:
        from_secret: s3_access_key
      secret_key:
        from_secret: s3_secret_key
    when:
      - event: [push, manual]
        branch: main
        path:
          include: ['guide/**']
    depends_on:
      - build-guide

  # =============================================================================
  # Initial Deployment (manual trigger for first deploy)
  # =============================================================================

  initial-deploy:
    image: bitnami/kubectl:latest
    environment:
      KUBECONFIG_DATA:
        from_secret: kubeconfig
    commands:
      - mkdir -p ~/.kube
      - echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config
      - kubectl apply -k deploy/
      - kubectl rollout status deployment/novuslang-website -n novus --timeout=120s
    when:
      - event: manual
      - evaluate: 'CI_PIPELINE_EVENT == "manual" && CI_COMMIT_MESSAGE contains "initial-deploy"'
