apiVersion: apps/v1
kind: Deployment
metadata:
  name: novuslang-website
  namespace: novus
  annotations:
    app.kubernetes.io/version: "1.0.3"
  labels:
    app: novuslang-website
    app.kubernetes.io/name: novuslang-website
    app.kubernetes.io/component: website
    app.kubernetes.io/part-of: novus-lang
spec:
  replicas: 2
  selector:
    matchLabels:
      app: novuslang-website
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: novuslang-website
    spec:
      # ADR 0007 (item 8, WAL-148): with maxUnavailable:0/maxSurge:1 a terminating
      # pod is dropped from Endpoints and gets SIGTERM (nginx fast-shutdown) before
      # Traefik finishes deregistering it, so requests routed in that ~1s window
      # briefly 502/conn-refuse. preStop holds the pod in rotation across the
      # endpoint-propagation window, then `nginx -s quit` drains in-flight conns.
      # graceperiod (35s) must exceed sleep+quit.
      terminationGracePeriodSeconds: 35
      containers:
        - name: website
          image: ghcr.io/barryw/novuslang-website:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 8; nginx -s quit"]
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            readOnlyRootFilesystem: false
            runAsNonRoot: false
      imagePullSecrets:
        - name: ghcr-secret
