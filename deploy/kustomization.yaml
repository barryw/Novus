apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: novus

resources:
  - namespace.yaml
  - website-deployment.yaml
  - website-service.yaml
  - website-ingress.yaml
  - website-pdb.yaml
  # ci-rbac.yaml is applied manually, not via CI (chicken-and-egg problem)

commonLabels:
  app.kubernetes.io/managed-by: kustomize

images:
  - name: ghcr.io/barryw/novuslang-website
    newTag: latest
